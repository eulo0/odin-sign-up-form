<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Signup Form</title>
</head>
<body>
    <div class="container"> 
        <div class="left">
            <img src="assets/halie-west-25xggax4bSA-unsplash.jpg" class="plant-image">
            <div class="banner-background"> 
                <img src="assets/odin-lined.png" class="banner-image">
                <p class="banner-text">Odin</p>
            </div>
            <p class="attribution">Photo by <u>Halie West</u> on <u>Unsplash</u></p>
        </div>
        <div class="right">
            <div class="column-container">
                <div class="information-section">
                    <div class="container2a">
                            <p class="information-text">This is not a real online service. You need to know something like this in real life to
                            help you realize your deepest dreams. Sign up now to get started. 
                            </p>
                        <p class="information-text">
                            You know you want to.
                        </p>
                    </div>
                </div>
                <div class="form-section">
                    <div class="container2"> 
                    <p class="information-text">Let's do this!</p>
                    <form action="example.com/path" method="post">
                        <div class = form-container> 
                            <label for="first_name" class="label-text">First Name</label>
                            <input type="text" id="first_name">    
                        </div>
                        <div class = form-container> 
                            <label for="last_name" class="label-text">Last Name</label>
                            <input type="text" id="last_name">
                        </div>
                        <div class = form-container> 
                            <label for="Email">Email</label>
                            <input type="email" id="email">
                        </div>
                        <div class = form-container> 
                            <label for="phone_number">Phone Number</label>
                            <input type="number" id="phone_number">
                        </div>
                        <div class = form-container> 
                            <label for="password">Password</label>
                            <input type="password" id="password">
                        </div>
                        <div class = form-container> 
                            <label for="password_confirm">Confirm Password</label>
                            <input type="password" id="password_confirm">
                        </div>
                    </form>
                    </div>
                </div>
                <div class="login-section">
                    <div class="container2">
                        <button> Create Account </button>
                        <p class="login-haveAccount">Already have an account? <a>Log in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
