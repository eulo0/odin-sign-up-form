<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Signup Form</title>
</head>
<body>
    <div class="container"> 
        <div class="left">
            <img src="assets/halie-west-25xggax4bSA-unsplash.jpg" class="plant-image">
            <div class="banner-background"> 
                <img src="assets/odin-lined.png" class="banner-image">
                <p class="banner-text">Odin</p>
            </div>
            <p class="attribution">Photo by <u>Halie West</u> on <u>Unsplash</u></p>
        </div>
        <div class="right">
            <div class="column-container">
                <div class="information-section">
                    <div class="container2a">
                            <p class="information-text">This is not a real online service. You need to know something like this in real life to
                            help you realize your deepest dreams. Sign up <em> now </em> to get started. 
                            </p>
                        <p class="information-text">
                            You <em> know </em> you want to.
                        </p>
                    </div>
                </div>
                <div class="form-section">
                    <div class="container2b"> 
                    <p class="information-text" style="margin-bottom:-0.1rem;">Let's do this!</p>
                    <form id="info" method="post" style="display:flex; width:100%;">
                        <div class = container-form-left>
                        
                            <div class = form-container> 
                                <label for="first_name" class="label-text">First Name</label>
                                <input type="text" id="first_name" required>   
                            </div>
                            <div class = form-container> 
                                <label for="Email" class="label-text">Email</label>
                                <input type="email" id="email" required>
                            </div>
                            <div class = form-container> 
                                <label for="password" class="label-text">Password</label>
                                <input type="password" id="password" required>
                            </div> 
                        </div>
                        <div class= "container-form-right">
                            <div class = form-container> 
                                <label for="last_name" class="label-text">Last Name</label>
                                <input type="text" id="last_name" required>
                            </div>
                            <div class = form-container> 
                                <label for="phone_number" class="label-text">Phone Number</label>
                                <input type="text" id="phone_number" required>
                            </div>
                            <div class = form-container> 
                                <label for="password_confirm" class="label-text">Confirm Password</label>
                                <input type="password" id="password_confirm" required>
                            </div>
                        </div>
                    </form>
                    </div>
                </div>
                <div class="login-section">
                    <div class="container2">
                        <button type="submit" form="info"> Create Account </button>
                        <p class="login-haveAccount">Already have an account? <a>Log in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
